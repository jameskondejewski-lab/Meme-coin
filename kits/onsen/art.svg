  <path d="M 620 720 C 680 650, 750 640, 825 650" fill="none" stroke="#3f2616" stroke-width="104" stroke-linecap="round"/><path d="M 620 720 C 680 650, 750 640, 825 650" fill="none" stroke="#efe2cb" stroke-width="80" stroke-linecap="round"/><path d="M 795 640 C 830 622, 880 626, 888 660 C 896 700, 882 742, 860 748 C 840 752, 828 730, 828 712 C 810 700, 788 676, 795 640 Z" fill="#d48f8c" stroke="#3f2616" stroke-width="10" stroke-linejoin="round"/><path d="M 868 712 L 868 736" stroke="#3f2616" stroke-width="7" stroke-linecap="round"/><path d="M 848 714 L 848 738" stroke="#3f2616" stroke-width="7" stroke-linecap="round"/>

