  <path d="M 533.2 234.4 Q 577.1 225.3 606.3 257.6 Q 650.6 263.5 666.5 303.1 Q 705.6 323.2 706.7 365.4 Q 735.9 397.0 721.9 436.8 Q 738.0 476.0 710.4 509.0 Q 711.5 551.1 673.5 573.0 Q 659.6 613.2 615.7 621.2 Q 588.2 654.9 543.9 647.9 Q 505.9 670.7 466.8 649.6 Q 422.9 658.7 393.7 626.4 Q 349.4 620.5 333.5 580.9 Q 294.4 560.8 293.3 518.6 Q 264.1 487.0 278.1 447.2 Q 262.0 408.0 289.6 375.0 Q 288.5 332.9 326.5 311.0 Q 340.4 270.8 384.3 262.8 Q 411.8 229.1 456.1 236.1 Q 494.1 213.3 533.2 234.4 Z" fill="#fff8ec" opacity="0.55"/>

