  <!-- blush -->
  <ellipse cx="396" cy="492" rx="38" ry="22" fill="#c02a45" opacity="0.4"/>
  <ellipse cx="604" cy="492" rx="38" ry="22" fill="#c02a45" opacity="0.4"/>

