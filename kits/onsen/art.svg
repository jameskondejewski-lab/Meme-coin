  <ellipse cx="515" cy="518" rx="9" ry="12" fill="#5a1f22"/>
  <!-- blissful smile -->
  <path d="M 436 566 Q 500 624 564 566" fill="none" stroke="#1f1008" stroke-width="16" stroke-linecap="round"/>

