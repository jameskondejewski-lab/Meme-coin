  <path d="M 526 416 Q 569 456 614 416" fill="none" stroke="#1f1008" stroke-width="24" stroke-linecap="round"/>
  <!-- brow ridge -->
  <path d="M 384 376 Q 430 354 468 372" fill="none" stroke="#b02a44" stroke-width="12" stroke-linecap="round"/>
  <path d="M 532 372 Q 570 354 616 376" fill="none" stroke="#b02a44" stroke-width="12" stroke-linecap="round"/>

